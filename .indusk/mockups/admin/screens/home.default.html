<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Projects</title>
		<link rel="stylesheet" href="../tokens.css" />
		<style>
			* { box-sizing: border-box; }
			body { margin: 0; background: var(--color-ground); color: var(--color-ink); font-family: var(--font-sans); font-size: var(--text-base); line-height: var(--leading-5); font-weight: var(--font-weight-regular); }
			h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
			ul, ol { list-style: none; }
			button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
			.page { max-width: var(--size-content); margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-16); display: grid; gap: var(--space-5); }
			.crumb { font-size: var(--text-sm); line-height: var(--leading-3); color: var(--color-ink-faint); }
			.crumb b { color: var(--color-ink-soft); font-weight: var(--font-weight-medium); }
			.title { font-family: var(--font-display); font-size: var(--text-4xl); line-height: var(--leading-7); font-weight: var(--font-weight-bold); }
			.says { font-family: var(--font-display); font-size: var(--text-3xl); line-height: var(--leading-7); font-weight: var(--font-weight-bold); max-width: 30ch; }
			.hint { font-size: var(--text-sm); line-height: var(--leading-3); color: var(--color-ink-faint); }
			.label { font-size: var(--text-2xs); line-height: var(--leading-1); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--color-ink-faint); }
			.mono { font-family: var(--font-mono); font-size: var(--text-xs); line-height: var(--leading-2); color: var(--color-ink-faint); overflow-wrap: anywhere; }
			.card { background: var(--color-surface); border-width: var(--border-1); border-style: solid; border-color: var(--color-line); border-radius: var(--radius-xl); padding: var(--space-4); display: grid; gap: var(--space-3); }
			.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border-radius: var(--radius-lg); font-weight: var(--font-weight-semibold); padding: var(--space-snug) var(--space-5); border-width: var(--border-1); border-style: solid; border-color: var(--color-line); background: var(--color-surface); }
			.btn.primary { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-surface); }
			.btn.quiet { padding: var(--space-tight) var(--space-3); font-size: var(--text-sm); line-height: var(--leading-3); font-weight: var(--font-weight-medium); }
			.actions { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
			.box { display: grid; gap: var(--space-3); }
			.box textarea { font: inherit; color: var(--color-ink); background: var(--color-surface); border-width: var(--border-1); border-style: solid; border-color: var(--color-line); border-radius: var(--radius-xl); padding: var(--space-4); min-height: var(--size-input); width: 100%; resize: vertical; }
			.attach { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); line-height: var(--leading-3); color: var(--color-ink-soft); }
			.file { display: inline-flex; align-items: center; gap: var(--space-2); background: var(--color-idle-wash); border-radius: var(--radius-pill); padding: var(--space-1) var(--space-3); font-size: var(--text-sm); line-height: var(--leading-3); color: var(--color-ink-soft); }
			.dot { width: var(--size-dot); height: var(--size-dot); border-radius: var(--radius-pill); background: var(--color-dusk); flex: none; }
			.dot.ok { background: var(--color-ok); }
			.dot.idle { background: var(--color-idle); }
			.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--space-3); }
			.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--size-side), 1fr)); gap: var(--space-4); }
			.pcard { background: var(--color-surface); border-width: var(--border-1); border-style: solid; border-color: var(--color-line); border-radius: var(--radius-lg); padding: var(--space-5); display: grid; gap: var(--space-1); }
			.pcard h2 { font-size: var(--text-base); line-height: var(--leading-5); font-weight: var(--font-weight-semibold); }
			.pcard .count { font-size: var(--text-sm); line-height: var(--leading-3); color: var(--color-ink-soft); margin-top: var(--space-2); }
		</style>
	</head>
	<body>
<main class="page">
<header class="head"><div><h1 class="title">Projects</h1><p class="hint">Every project registered on this machine.</p></div><button class="btn primary" type="button">New project</button></header>
<div class="cards"><indusk-component name="project-card" state="in-progress"></indusk-component><indusk-component name="project-card" state="default"></indusk-component><indusk-component name="project-card" state="workbench"></indusk-component></div>
</main>
	</body>
</html>
