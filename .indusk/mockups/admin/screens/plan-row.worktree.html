<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="indusk-new-components" content="plan-row" />
		<title>plan-row — worktree</title>
		<link rel="stylesheet" href="../tokens.css" />
		<style>
			* { box-sizing: border-box; }
			body { margin: 0; background: var(--color-ground); color: var(--color-ink); font-family: var(--font-sans); font-size: var(--text-base); line-height: var(--leading-5); font-weight: var(--font-weight-regular); }
			button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
			.navcol { width: var(--size-nav); max-width: 100%; padding: var(--space-4) var(--space-3); display: grid; gap: var(--space-hair); background: var(--color-surface); min-height: 100vh; border-right-width: var(--border-1); border-right-style: solid; border-right-color: var(--color-line); }
			.group { font-size: var(--text-2xs); line-height: var(--leading-1); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--color-ink-faint); margin: var(--space-3) var(--space-tight) var(--space-1); }
			.pr { display: grid; grid-template-columns: var(--size-badge) minmax(0, 1fr); gap: var(--space-2); align-items: start; width: 100%; padding: var(--space-tight); border-width: var(--border-1); border-style: solid; border-color: transparent; border-radius: var(--radius-lg); text-align: left; color: var(--color-ink); text-decoration: none; }
			.pr.current { border-color: var(--color-dusk); background: var(--color-dusk-wash); }
			.lines { display: grid; gap: var(--space-hair); min-width: 0; }
			.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-md); line-height: var(--leading-4); font-weight: var(--font-weight-medium); }
			.stage { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-xs); line-height: var(--leading-2); color: var(--color-ink-faint); }
			.pr.needs .stage { color: var(--color-dusk); }
			.pr.queued .stage { font-style: italic; }
			.extra { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1); min-width: 0; }
		</style>
	</head>
	<body>
<nav class="navcol" aria-label="Plans">
	<div class="group">Plans</div>
	<a data-component="plan-row" data-state="worktree" class="pr current" href="#"><indusk-component name="badge" state="working">FL</indusk-component><span class="lines"><span class="name">Faster look checks</span><span class="stage">Falsify</span><span class="extra"><indusk-component name="tag" state="default">⎇ looks-check-speed</indusk-component></span></span></a>
	<a data-component="plan-row" data-state="worktree" class="pr needs" href="#"><indusk-component name="badge" state="needs">NS</indusk-component><span class="lines"><span class="name">The nav says where a plan is</span><span class="stage">Approve the brief</span><span class="extra"><indusk-component name="tag" state="default">⎇ nav-stage-matches-plan-page</indusk-component></span></span></a>
	<a data-component="plan-row" data-state="released" class="pr" href="#"><indusk-component name="badge" state="released">PS</indusk-component><span class="lines"><span class="name">Plan stories</span><span class="stage">Released</span></span></a>
	<a data-component="plan-row" data-state="idle" class="pr" href="#"><indusk-component name="badge" state="idle">LP</indusk-component><span class="lines"><span class="name">Looks as promises</span><span class="stage">Draft</span></span></a>
	<a data-component="plan-row" data-state="queued" class="pr queued" href="#"><indusk-component name="badge" state="idle">WF</indusk-component><span class="lines"><span class="name">Watched from day one</span><span class="stage">Queued</span></span></a>
</nav>
	</body>
</html>
