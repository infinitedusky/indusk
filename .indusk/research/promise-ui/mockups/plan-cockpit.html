<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}</style>
</head>
<body>
<title>Plan Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a collapsible plans nav on the left. Beside it, the cockpit: promises on top,
   then a vertical rail with two workflows (Planning, Release) beside one decision card. */
:root {
  --ink: #18202b;
  --ink-soft: #4a5566;
  --ink-faint: #7b8697;
  --ground: #f3f5f8;
  --surface: #ffffff;
  --line: #dde2ea;
  --dusk: #c2620b;          /* accent: the last light at dusk */
  --dusk-wash: #fbeee0;
  --ok: #1f7a4d;   --ok-wash: #e3f3ea;
  --warn: #9a6a00; --warn-wash: #fbf1d6;
  --bad: #b3261e;  --bad-wash: #fbe5e3;
  --idle: #8a94a3; --idle-wash: #eceff3;
  --shadow: 0 1px 2px rgba(24,32,43,.06), 0 6px 20px rgba(24,32,43,.06);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: #e8ecf2; --ink-soft: #b4bdca; --ink-faint: #8792a3;
    --ground: #12161d; --surface: #1a2029; --line: #2b3340;
    --dusk: #f0913a; --dusk-wash: #3a2614;
    --ok: #5cc98f; --ok-wash: #143225;
    --warn: #e7b84a; --warn-wash: #352a10;
    --bad: #f07a71; --bad-wash: #3a1917;
    --idle: #8792a3; --idle-wash: #232a35;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e8ecf2; --ink-soft: #b4bdca; --ink-faint: #8792a3;
  --ground: #12161d; --surface: #1a2029; --line: #2b3340;
  --dusk: #f0913a; --dusk-wash: #3a2614;
  --ok: #5cc98f; --ok-wash: #143225;
  --warn: #e7b84a; --warn-wash: #352a10;
  --bad: #f07a71; --bad-wash: #3a1917;
  --idle: #8792a3; --idle-wash: #232a35;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--ground); color: var(--ink);
  font: 15px/1.55 var(--body);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--dusk); outline-offset: 2px; }

/* app shell: plans nav on the left, the cockpit beside it */
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.content { min-width: 0; padding: 0 clamp(16px, 4vw, 40px) 64px; container-type: inline-size; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }

.sidenav {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; overflow-x: hidden;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px; padding: 16px 10px 20px;
}
.navhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 8px; }
.projtext { display: grid; min-width: 0; }
.projtext b { font: 700 16px/1.2 var(--display); }
.projtext small { font-size: 12px; color: var(--ink-faint); }
.iconbtn { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink-soft); padding: 0; }
.iconbtn:hover { border-color: var(--ink-faint); color: var(--ink); }
.iconbtn svg { transition: transform .2s; }
.ngroup { display: flex; justify-content: space-between; align-items: center; margin: 14px 6px 4px; font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-faint); }
.plan { display: grid; grid-template-columns: 14px 30px minmax(0, 1fr); gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px; }
.plan:hover { background: var(--ground); }
.plan[aria-current="page"] { background: var(--dusk-wash); border-color: var(--dusk); }
.badge { position: relative; width: 30px; height: 30px; border-radius: 7px; background: var(--ground); border: 1px solid var(--line); display: grid; place-items: center; font: 500 11px/1 var(--mono); color: var(--ink-soft); }
.badge::after { content: ""; position: absolute; top: -4px; right: -4px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--surface); background: var(--idle); }
.badge.needs::after { background: var(--dusk); }
.badge.working::after { background: var(--ink-soft); animation: pulse 1.6s ease-in-out infinite; }
.badge.released::after { background: var(--ok); }
.ptext { display: grid; min-width: 0; }
.num { font: 500 11px/1 var(--mono); color: var(--ink-faint); text-align: right; font-variant-numeric: tabular-nums; }
.needsbox { display: grid; gap: 2px; }
.needsbox .plan { grid-template-columns: 0 30px minmax(0, 1fr); }
.pathnode { display: grid; gap: 2px; }
.pathrow { display: grid; grid-template-columns: 14px 12px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 6px; }
.pathrow:hover { background: var(--ground); }
.pathrow .chev { color: var(--ink-faint); transition: transform .15s; }
.pathrow[aria-expanded="true"] .chev { transform: rotate(90deg); }
.pathname { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.needsdot { width: 7px; height: 7px; border-radius: 50%; background: var(--dusk); }
.pathkids { display: grid; gap: 2px; margin-left: 27px; padding-left: 6px; border-left: 1px solid var(--line); }
.pathkids .pathkids { margin-left: 20px; }
.shut { display: none; }
.pstage.queued { color: var(--ink-faint); font-style: italic; }
.viewlink { display: grid; grid-template-columns: 14px 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px; margin-top: 4px; }
.viewlink:hover { background: var(--ground); }
.viewlink[aria-current="page"] { background: var(--dusk-wash); border-color: var(--dusk); }
.vicon { grid-column: 2; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: var(--ink); color: var(--surface); }
.vtext { font-weight: 600; font-size: 14px; }
.vcount { font: 600 11px/1 var(--mono); color: var(--bad); background: var(--bad-wash); border-radius: 999px; padding: 4px 7px; }
.viewstack { display: grid; gap: 20px; min-width: 0; }

/* ---------- promise dashboard ---------- */
.summary { display: grid; gap: 10px; }
.sbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--surface); }
.sbar span { display: block; min-width: 4px; }
.seg-broken { background: var(--bad); } .seg-proving { background: var(--warn); } .seg-declared { background: var(--idle); } .seg-enforced { background: var(--ok); }
.slegend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-soft); }
.slegend b { font: 600 14px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px; }
.slegend .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 2px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 11px; font-size: 13px; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-faint); }
.ctl select, .ctl input { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.ctl input { width: 200px; max-width: 100%; }
.pgroup { display: grid; gap: 6px; }
.pghead { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
.pghead h3 { font: 700 17px/1.2 var(--display); margin: 0; }
.ptable { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.prow, .phead { display: grid; grid-template-columns: 10px minmax(0, 1fr) 120px 140px 72px; gap: 14px; align-items: center; padding: 12px 16px; }
.phead { padding-block: 8px; font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); background: var(--ground); border-bottom: 1px solid var(--line); }
.prow { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); }
.prow:first-of-type { border-top: 0; }
.phead + .prow { border-top: 0; }
.prow:hover { background: var(--ground); }
.prow .d { width: 10px; height: 10px; border-radius: 50%; }
.psays { font-weight: 500; line-height: 1.4; display: block; }
.pmeta { font: 400 12px/1.4 var(--mono); color: var(--ink-faint); display: block; margin-top: 2px; overflow-wrap: anywhere; }
.ptests { display: flex; align-items: center; gap: 8px; }
.pips { display: flex; gap: 3px; }
.pip { width: 10px; height: 6px; border-radius: 2px; background: var(--idle-wash); border: 1px solid var(--line); }
.pip.written { background: var(--warn-wash); border-color: var(--warn); }
.pip.passing { background: var(--ok); border-color: var(--ok); }
.pevals { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pevals .bad { color: var(--bad); font-weight: 600; }
.pevals .quiet, .plast { color: var(--ink-faint); font-size: 13px; }
.plast { text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 18px; color: var(--ink-faint); font-size: 14px; }
@container (max-width: 640px) {
  .phead { display: none; }
  .prow { grid-template-columns: 10px minmax(0, 1fr) auto; grid-template-areas: "d says says" ". tests last" ". evals evals"; row-gap: 6px; column-gap: 12px; }
  .prow .d { grid-area: d; align-self: start; margin-top: 6px; } .prow .ptitle { grid-area: says; } .prow .ptests { grid-area: tests; } .prow .pevals { grid-area: evals; } .prow .plast { grid-area: last; }
}

/* ---------- promise page ---------- */
.back { justify-self: start; background: none; border: 0; padding: 0; color: var(--ink-soft); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--ink); }
.phero { display: grid; gap: 10px; }
.phero .says { font: 700 26px/1.25 var(--display); margin: 0; text-wrap: balance; max-width: 30ch; }
.phero .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--ink-faint); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.linkbtn:hover { text-decoration-color: var(--ink); }
.alert { background: var(--bad-wash); border: 1px solid var(--bad); border-radius: 12px; padding: 14px 18px; display: grid; gap: 10px; }
.alert p { margin: 0; color: var(--ink); max-width: 70ch; }
.alert .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stat { background: var(--surface); padding: 12px 16px; display: grid; gap: 4px; }
.stat .k { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); }
.stat .v { font: 600 18px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.stat .v.bad { color: var(--bad); } .stat .v.ok { color: var(--ok); }
.stat .sub { font-size: 12px; color: var(--ink-faint); }
@container (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pcols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@container (max-width: 820px) { .pcols { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.box h3 { font: 700 17px/1.2 var(--display); margin: 0; }
.box .hint { margin: -6px 0 0; font-size: 13px; color: var(--ink-faint); }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); padding: 0 10px 8px 0; white-space: nowrap; }
.tbl td { padding: 9px 10px 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tbl .mono { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
.trig { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.trig li { display: grid; gap: 4px; padding: 10px 12px; border-radius: 9px; background: var(--ground); }
.trig .top1 { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 10px; align-items: center; }
.trig code { font: 500 13px/1.3 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.trig .when { font-size: 13px; color: var(--ink-soft); }
.trig .check { font-size: 13px; color: var(--ink-soft); }
.trig .check b { font-weight: 600; color: var(--ink); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 56px 14px minmax(0, 1fr); gap: 8px; position: relative; padding-bottom: 12px; font-size: 14px; }
.timeline li:not(:last-child)::after { content: ""; position: absolute; left: 70px; top: 14px; bottom: -2px; width: 2px; background: var(--line); }
.timeline .when { font: 500 12px/1.6 var(--mono); color: var(--ink-faint); white-space: nowrap; }
.timeline .tdot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--surface); border: 2px solid var(--idle); position: relative; z-index: 1; }
.timeline li.good .tdot { background: var(--ok); border-color: var(--ok); }
.timeline li.bad .tdot { background: var(--bad); border-color: var(--bad); }
.timeline li.bad .what { color: var(--bad); }
.chart svg { width: 100%; height: auto; display: block; }
.chart .held { fill: var(--ok); } .chart .broke { fill: var(--bad); } .chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--ink-faint); font: 10px var(--mono); }
.chart p { margin: 0; font-size: 13px; color: var(--ink-soft); }
.sibs { display: grid; gap: 4px; }
.sib { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 6px 4px; border-radius: 6px; font-size: 13px; }
.sib:hover { background: var(--ground); }
.sib .d { width: 8px; height: 8px; border-radius: 50%; }
.facts dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 13px; }
.facts dt { color: var(--ink-faint); } .facts dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.pname { font-weight: 500; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.pstage { font-size: 12px; line-height: 1.3; color: var(--ink-faint); }
.pstage.needs { color: var(--dusk); }
.menubtn { display: none; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 10px; font-size: 13px; font-weight: 500; }
.menubtn .count { color: var(--surface); background: var(--dusk); border-radius: 999px; padding: 3px 6px; font-size: 11px; }
.scrim { display: none; }

/* collapsed: a narrow strip of plan badges (desktop only) */
@media (min-width: 761px) {
  .shell.collapsed { grid-template-columns: 64px minmax(0, 1fr); }
  .collapsed .sidenav { padding-inline: 10px; }
  .collapsed .projtext, .collapsed .ptext { display: none; }
  .collapsed .navhead { justify-content: center; padding-inline: 0; }
  .collapsed .iconbtn svg { transform: rotate(180deg); }
  .collapsed .ngroup { height: 1px; margin: 10px 6px; background: var(--line); }
  .collapsed .ngroup > * { display: none; }
  .collapsed .plan, .collapsed .needsbox .plan { grid-template-columns: 30px; justify-content: center; padding: 6px 0; }
  .collapsed .num, .collapsed .pathrow, .collapsed .needsbox, .collapsed .vtext { display: none; }
  .collapsed .viewlink { grid-template-columns: 30px; justify-content: center; padding: 6px 0; position: relative; }
  .collapsed .vicon { grid-column: 1; }
  .collapsed .vcount { position: absolute; top: 0; right: 2px; padding: 2px 4px; font-size: 9px; }
  .collapsed .pathkids, .collapsed .pathkids .pathkids { display: grid; margin: 0; padding: 0; border: 0; }
  .collapsed .pathnode.rootpath + .pathnode.rootpath { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
}
/* phone: the nav is a drawer, closed by default */
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidenav {
    position: fixed; top: 0; bottom: 0; left: 0; height: auto; width: min(300px, 86vw); z-index: 20;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow);
  }
  .shell.open .sidenav { transform: none; }
  .shell.open .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: var(--ink); opacity: .35; }
  .menubtn { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) { .sidenav, .iconbtn svg { transition: none; } .badge.working::after { animation: none; } }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 20px 4px; }
.crumb { font-size: 13px; color: var(--ink-faint); }
.crumb b { color: var(--ink-soft); font-weight: 500; }
.plan-title { font: 700 30px/1.1 var(--display); letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
.top .meta { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font: 500 12px/1 var(--mono); padding: 6px 9px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft); white-space: nowrap; }
.tag.workbench { border-color: var(--dusk); color: var(--dusk); }
.sample { font-size: 12px; color: var(--ink-faint); }

/* section labels */
.label { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-faint); margin: 0 0 10px; }

/* promises: pills first; a pill opens to its sentence, then its tests */
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; }
.pill[aria-expanded="true"] { border-color: var(--dusk); }
.pill .d { width: 8px; height: 8px; border-radius: 50%; }
.d.declared { background: var(--idle); } .d.proving { background: var(--warn); } .d.enforced { background: var(--ok); } .d.broken { background: var(--bad); }
.pill .count { font-size: 11px; }
.more { background: none; border: none; padding: 0; color: var(--ink-soft); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.count { font: 500 12px/1 var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.declared { color: var(--idle); background: var(--idle-wash); }
.chip.proving { color: var(--warn); background: var(--warn-wash); }
.chip.enforced { color: var(--ok); background: var(--ok-wash); }
.chip.broken { color: var(--bad); background: var(--bad-wash); }
.chip.active { color: var(--dusk); background: var(--dusk-wash); }

/* promise detail */
.detail { background: var(--surface); border: 1px solid var(--dusk); border-radius: 10px; padding: 18px 20px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.detail h3 { font: 700 20px/1.25 var(--display); margin: 0; text-wrap: balance; }
.detail .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.tests { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tests li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; background: var(--ground); }
.tests .id { font: 500 12px/1 var(--mono); color: var(--ink-faint); }
.tests .state { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .05em; }
.state.planned { color: var(--idle); } .state.written { color: var(--warn); } .state.passing { color: var(--ok); }
.watch { display: grid; gap: 8px; }
.watch svg { width: 100%; height: 56px; display: block; }
.watch p { margin: 0; font-size: 13px; color: var(--ink-soft); }

/* main area: vertical rail of two workflows beside the decision card */
.stagebody { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 20px; align-items: start; }
@container (max-width: 680px) { .stagebody { grid-template-columns: minmax(0, 1fr); } }
.rail { display: grid; gap: 16px; align-content: start; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px 8px; display: grid; gap: 6px; }
.group.current { border-color: var(--dusk); }
.ghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 6px; flex-wrap: wrap; }
.ghead h3 { font: 700 17px/1.2 var(--display); margin: 0; }
.gsub { margin: 0; padding-inline: 6px 6px; font-size: 12px; color: var(--ink-faint); }
.gmeta { display: flex; gap: 8px; align-items: center; }
.steps { list-style: none; margin: 6px 0 0; padding: 0; }
.steps li { position: relative; }
.steps li:not(:last-child)::after {
  content: ""; position: absolute; left: 16px; top: 28px; bottom: -8px; width: 2px; background: var(--line);
}
.steps li.done:not(:last-child)::after { background: var(--ok); }
.step {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 6px;
  position: relative; z-index: 1;
}
.step:hover:not(:disabled) { background: var(--ground); }
.step[aria-current="step"] { background: var(--ground); border-color: var(--ink-faint); }
.step:disabled { cursor: default; }
.step .n { font-weight: 500; font-size: 14px; }
.step .s { font: 500 11px/1 var(--mono); color: var(--ink-faint); white-space: nowrap; }
.node { width: 12px; height: 12px; margin-left: 4px; border-radius: 50%; border: 2px solid var(--idle); background: var(--surface); display: grid; place-items: center; }
.waiting .step .n { color: var(--ink-faint); }
.done .node { background: var(--ok); border-color: var(--ok); }
.done .s { color: var(--ok); }
.skipped .node { border-style: dashed; }
.working .node { border-color: var(--dusk); background: var(--dusk); animation: pulse 1.2s ease-in-out infinite; }
.working .s, .needs .s { color: var(--dusk); }
.needs .node { border-color: var(--dusk); background: var(--surface); box-shadow: 0 0 0 4px var(--dusk-wash); }
.needs .node::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--dusk); }
.needs .n { font-weight: 600; }

/* decision card */
.main { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.card.ask { border-color: var(--dusk); }
.card .who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-faint); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.dot.ask { background: var(--dusk); }
.dot.busy { background: var(--dusk); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.busy, .working .node { animation: none; } }
.card h2 { font: 700 22px/1.25 var(--display); margin: 0; text-wrap: balance; }
.card p { margin: 0; max-width: 64ch; color: var(--ink-soft); }
.answers { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border-radius: 9px; padding: 10px 18px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); }
.btn.yes { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.maybe { border-style: dashed; }
.btn:hover { border-color: var(--ink-faint); }
.reply { display: grid; gap: 8px; }
.reply textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font: inherit; background: var(--ground); color: var(--ink); }
.reply .row { display: flex; gap: 8px; justify-content: flex-end; }
.progress { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.progress li { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-soft); }
.progress .tick { width: 18px; text-align: center; font-weight: 700; }
.progress .ok { color: var(--ok); } .progress .run { color: var(--dusk); } .progress .wait { color: var(--idle); }
.you-said { font-size: 13px; color: var(--ink-faint); border-left: 2px solid var(--line); padding-left: 10px; }

.side { display: grid; gap: 12px; }
.panel dl, #facts dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 13px; }
#facts dt { color: var(--ink-faint); }
#facts dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
details.log { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 13px; }
details.log summary { cursor: pointer; color: var(--ink-soft); font-weight: 500; }
details.log ol { margin: 10px 0 4px; padding-left: 18px; color: var(--ink-faint); font-family: var(--mono); font-size: 12px; display: grid; gap: 4px; }
.reset { background: none; border: none; color: var(--ink-faint); font-size: 12px; text-decoration: underline; justify-self: start; padding: 0; }
</style>

<script>
const STAGES = ["Brief", "Test plan", "Decision", "Impl", "Build", "Falsify", "Cleanup", "Review", "Release"];
/* Two separate workflows. Planning ends when the build is approved; Release is everything after. */
const GROUPS = [
  { name: "Planning", sub: "Agree what to build and how", from: 0, to: 3, done: "approved" },
  { name: "Release", sub: "Build it, break it, ship it", from: 4, to: 8, done: "released" },
];

/* Every plan in the project. Only left-nav is live in this mockup. */
const PLANS = [
  { slug: "left-nav", live: true },
  { slug: "guest-profile-merge", stage: 7, state: "needs" },
  { slug: "loyalty-tiers", stage: 1, state: "needs" },
  { slug: "booking-reminders", stage: 4, state: "needs" },
  { slug: "menu-sync", stage: 5, state: "working" },
  { slug: "invoice-export", stage: 4, state: "working" },
  { slug: "room-service-tips", stage: 0, state: "working" },
  { slug: "late-checkout", stage: 0, state: "queued" },
  { slug: "staff-shift-notes", stage: 8, state: "released" },
  { slug: "checkout-receipts", stage: 8, state: "released" },
];
/* Paths: ordered groups of plans or other paths. */
const TREE = [
  { id: "guest-stay", name: "Guest stay", items: [
    "guest-profile-merge",
    { id: "arrivals", name: "Arrivals", items: ["booking-reminders", "room-service-tips"] },
    "loyalty-tiers",
    "late-checkout",
  ] },
  { id: "billing", name: "Billing", items: ["checkout-receipts", "invoice-export"] },
  { id: "staff-tools", name: "Staff tools", items: ["staff-shift-notes", "left-nav", "menu-sync"] },
];
const OPEN = new Set(["guest-stay", "arrivals", "billing", "staff-tools"]);
let SEL = "left-nav";

const PROMISES = [
  { name: "every-plan-is-one-click-away", short: "One click away", kind: "behaviour",
    says: "Every active plan in a project is one click away from any page.",
    tests: [
      { id: "A1", what: "The nav lists every active plan, in the master's order", level: "unit" },
      { id: "A2", what: "Clicking a plan opens its page and marks it current", level: "unit" },
      { id: "A3", what: "A plan added on disk appears without a reload", level: "contract" } ] },
  { name: "the-nav-fits-a-phone", short: "Fits a phone", kind: "structure",
    says: "On a phone the nav folds away and never pushes the page sideways.",
    tests: [
      { id: "A4", what: "Below 600 px the nav is a drawer, closed by default", level: "unit" },
      { id: "A5", what: "No page scrolls sideways at 400 px with forty plans", level: "contract" } ] },
  { name: "a-review-shows-its-evidence", short: "Review shows proof", kind: "existing", existing: true,
    says: "The review shows each promise with the tests that prove it.",
    tests: [ { id: "A6", what: "The nav's review link shows the plan's proof count", level: "unit" } ] },
];

const initial = () => ({
  stage: 2, // Decision
  status: ["done", "done", "needs", "waiting", "waiting", "waiting", "waiting", "waiting", "waiting"],
  tests: { A1: "planned", A2: "planned", A3: "planned", A4: "planned", A5: "planned", A6: "passing" },
  open: null, showTests: false, why: false,
  view: 2,
  step: "adr",
  maybe: false,
  said: null,
  log: ["Brief accepted · 2 promises declared, 1 kept from admin-plan-authoring",
        "Test plan accepted · 6 assertions",
        "Decision record drafted · waiting for you"],
});
let S = initial();

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function promiseState(p) {
  const st = p.tests.map((t) => S.tests[t.id]);
  if (p.existing) return "enforced";
  if (S.status[8] === "done") return "enforced";
  if (st.every((x) => x === "passing")) return "proving";
  if (st.some((x) => x !== "planned")) return "proving";
  return "declared";
}
const chipText = { declared: "declared", proving: "being proven", enforced: "enforced", broken: "broken" };

function renderPromises() {
  $("promises").innerHTML = PROMISES.map((p, i) => {
    const st = promiseState(p);
    const pass = p.tests.filter((t) => S.tests[t.id] === "passing").length;
    return `<button class="pill" type="button" data-p="${i}" aria-expanded="${S.open === i}" title="${chipText[st]}">
      <span class="d ${st}"></span>${esc(p.short)}<span class="count">${pass}/${p.tests.length}</span></button>`;
  }).join("");
  document.querySelectorAll(".pill").forEach((b) => b.onclick = () => {
    const i = +b.dataset.p; S.open = S.open === i ? null : i; S.showTests = false; render(); });
}

function spark(points, color) {
  const w = 300, h = 56, max = 4;
  const step = w / (points.length - 1);
  const ys = points.map((v) => h - 6 - (v / max) * (h - 14));
  const line = ys.map((y, i) => `${i ? "L" : "M"}${(i * step).toFixed(1)},${y.toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Marks per day, last 14 days">
    <path d="${line} L${w},${h} L0,${h} Z" fill="${color}" opacity=".12"></path>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2"></path>
    <circle cx="${w}" cy="${ys[ys.length - 1].toFixed(1)}" r="3.5" fill="${color}"></circle></svg>`;
}

function renderDetail() {
  const host = $("detailHost");
  if (S.open === null) { host.hidden = true; host.innerHTML = ""; return; }
  const p = PROMISES[S.open];
  const st = promiseState(p);
  const watched = st === "enforced";
  host.hidden = false;
  host.innerHTML = `<div class="detail">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip ${st}">${chipText[st]}</span>
      ${p.existing ? '<span class="tag">kept from earlier work</span>' : ""}</div>
    <h3>${esc(p.says)}</h3>
    <div style="display:flex;gap:16px;flex-wrap:wrap"><button class="more" type="button" id="openProm">Open promise page</button><button class="more" type="button" id="toggleTests">${S.showTests ? "Hide the proof" : "Show the proof"}</button></div>
    ${S.showTests ? `<div class="grid">
      <div><p class="label">Tests</p><ul class="tests">
        ${p.tests.map((t) => `<li><span class="id">${t.id}</span><span>${esc(t.what)}</span><span class="state ${S.tests[t.id]}">${S.tests[t.id]}</span></li>`).join("")}
      </ul></div>
      <div class="watch"><p class="label">In use</p>
        ${watched
          ? `${spark([2,3,2,4,3,3,2,3,4,3,2,3,3,4], "var(--ok)")}<p>Held 41 times in 14 days. Never broken.</p>`
          : `<p>Watched once it ships.</p>`}
      </div></div>
      <p class="id" style="margin:0;font:500 12px var(--mono);color:var(--ink-faint)">${esc(p.name)} · ${p.kind}</p>` : ""}
  </div>`;
  $("toggleTests").onclick = () => { S.showTests = !S.showTests; render(); };
  $("openProm").onclick = () => openPromise(p.name);
}

const statusText = { done: "done", needs: "needs you", working: "working…", waiting: "not yet", skipped: "skipped" };

/* The rail: two vertical workflows, each with its own progress. */
function renderRail(status, view, live) {
  $("rail").innerHTML = GROUPS.map((g, gi) => {
    const idx = []; for (let i = g.from; i <= g.to; i++) idx.push(i);
    const doneN = idx.filter((i) => status[i] === "done").length;
    const allDone = doneN === idx.length;
    const started = idx.some((i) => status[i] !== "waiting");
    const cls = allDone ? "enforced" : started ? "active" : "declared";
    const label = allDone ? g.done : started ? "in progress" : "not started";
    const current = idx.includes(view);
    return `<div class="group ${current ? "current" : ""}" role="group" aria-label="${g.name}">
      <div class="ghead"><h3>${g.name}</h3><span class="gmeta"><span class="count">${doneN}/${idx.length}</span><span class="chip ${cls}">${label}</span></span></div>
      <p class="gsub">${g.sub}</p>
      <ol class="steps">${idx.map((i) => {
        const st = status[i];
        return `<li class="${st}"><button class="step" type="button" data-s="${i}" ${st === "waiting" || !live ? "disabled" : ""} ${view === i ? 'aria-current="step"' : ""}>
          <span class="node" aria-hidden="true"></span><span class="n">${STAGES[i]}</span><span class="s">${statusText[st]}</span></button></li>`;
      }).join("")}</ol></div>`;
  }).join("");
  document.querySelectorAll(".step").forEach((b) => b.onclick = () => { S.view = +b.dataset.s; S.maybe = false; S.why = false; render(); });
}

/* The cards: what Claude says when it needs you, and what it shows while it works. */
const CARDS = {
  adr: {
    ask: true,
    title: "Use a sidebar that folds into a drawer on phones?",
    body: "The decision record weighs a left sidebar against a top bar. A sidebar keeps every plan visible on a laptop, which is what the first promise asks for. On a phone it folds into a drawer, which keeps the second. A top bar would hide plans behind a menu at every width.",
    yes: "Accept the decision", no: "Use a top bar instead",
    maybeReply: "Good point. I'll keep the sidebar and note that plans group by status once there are more than twelve. The record is updated. Accept it now?",
  },
  impl: {
    ask: true,
    title: "Approve the plan and start the build?",
    body: "The plan has three build phases and six tests. The tests are written first and fail until the code makes them pass. The build runs without asking you anything, unless it reaches a choice the plan says is yours. Approving ends planning and begins the release workflow.",
    yes: "Approve and build", no: "Not yet",
    maybeReply: "Understood. I'll split the drawer into its own phase so it can be reviewed on its own. Still three phases, now in a different order. Start the build?",
  },
  midbuild: {
    ask: true,
    title: "Forty plans don't fit a phone screen. Group them, or scroll?",
    body: "Phase 2 reached the choice the plan marked as yours. Grouping by status keeps the drawer short and puts plans that need you first. Scrolling keeps the master's order but makes long lists hard to scan.",
    yes: "Group by status", no: "Scroll",
    maybeReply: "Grouping with the master's order inside each group is possible: needs-you first, then building, then the rest. I'll do that. Continue the build?",
  },
  review: {
    ask: true,
    title: "Both promises are proven. Release it?",
    body: "Every test behind both promises passes. Falsification tried five ways to break the nav and found one: a plan renamed on disk kept its old link. It's fixed, and a sixth test now guards it. Cleanup found nothing to change. Twelve files changed, all in concierge-web.",
    yes: "Accept and release", no: "Send it back",
    maybeReply: "I'll show the renamed-plan fix side by side. It's one line in the reader and one test. Release once you've seen it?",
  },
};

/* Plan status: the live plan reads the mockup's state; the rest are fixed samples. */
function planInfo(p) {
  if (!p.live) return { stage: p.state === "queued" ? -1 : p.stage, state: p.state };
  const state = S.status.includes("needs") ? "needs" : S.status.every((x) => x === "done") ? "released" : "working";
  return { stage: S.stage, state };
}
function planStatus(p) {
  if (p.live) return S.status;
  if (p.state === "queued") return STAGES.map(() => "waiting");
  return STAGES.map((_, i) => p.state === "released" || i < p.stage ? "done" : i === p.stage ? (p.state === "needs" ? "needs" : "working") : "waiting");
}
const initials = (slug) => slug.split("-").slice(0, 2).map((w) => w[0].toUpperCase()).join("");

const planBySlug = (s) => PLANS.find((p) => p.slug === s);
const infoOf = (s) => planInfo(planBySlug(s));
const plansIn = (node) => node.items.flatMap((it) => typeof it === "string" ? [it] : plansIn(it));
/* The chain of paths that hold a plan, outermost first, plus the plan's place in its own path. */
function locate(slug, items = TREE, chain = []) {
  for (const it of items) {
    if (typeof it !== "string") { const r = locate(slug, it.items, [...chain, it]); if (r) return r; }
  }
  const i = items.indexOf(slug);
  return i >= 0 ? { chain, prev: i > 0 ? items[i - 1] : null } : null;
}
const subText = (r) => r.state === "released" ? "Released" : r.state === "queued" ? "Not started"
  : `${STAGES[r.stage]} · ${r.state === "needs" ? "needs you" : "working"}`;
const CHEV = `<svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>`;

function planRow(slug, num) {
  const r = infoOf(slug), sub = subText(r);
  return `<button class="plan" type="button" data-slug="${slug}" title="${slug} — ${sub}" ${VIEW === "plan" && SEL === slug ? 'aria-current="page"' : ""}>
    <span class="num">${num}</span>
    <span class="badge ${r.state}" aria-hidden="true">${initials(slug)}</span>
    <span class="ptext"><span class="pname">${slug}</span><span class="pstage ${r.state}">${sub}</span></span></button>`;
}
function treeHTML(items, top) {
  return items.map((it, i) => {
    const num = top ? "" : i + 1;
    if (typeof it === "string") return planRow(it, num);
    const slugs = plansIn(it);
    const rel = slugs.filter((s) => infoOf(s).state === "released").length;
    const needs = slugs.some((s) => infoOf(s).state === "needs");
    const open = OPEN.has(it.id);
    return `<div class="pathnode ${top ? "rootpath" : ""}">
      <button class="pathrow" type="button" data-path="${it.id}" aria-expanded="${open}">
        <span class="num">${num}</span>${CHEV}<span class="pathname">${esc(it.name)}</span>
        ${needs ? '<span class="needsdot" title="A plan in this path needs you"></span>' : ""}
        <span class="count" title="${rel} of ${slugs.length} plans released">${rel}/${slugs.length}</span></button>
      <div class="pathkids ${open ? "" : "shut"}">${treeHTML(it.items, false)}</div></div>`;
  }).join("");
}

function renderNav() {
  const needs = PLANS.filter((p) => planInfo(p).state === "needs").map((p) => p.slug);
  $("planList").innerHTML =

/* 30 days of evals: how many held, how many broke, per day. Day 29 is today. */
function series(seed, avg, breaks = []) {
  let x = seed * 7919;
  return Array.from({ length: 30 }, (_, i) => {
    x = (x * 9301 + 49297) % 233280;
    return { held: Math.max(0, Math.round(avg * (0.5 + x / 233280))), broke: breaks.filter((b) => b === i).length };
  });
}

function allPromises() {
  const live = PROMISES.map((p) => {
    const x = LIVE_EXTRA[p.name] || {};
    const state = promiseState(p);
    const released = S.status[8] === "done";
    const tstates = p.tests.map((t) => S.tests[t.id]);
    const history = x.history || [
      ["Sep 30", "Declared in the left-nav brief"], ["Oct 1", `${p.tests.length} tests planned`],
      ...(tstates.some((s) => s !== "planned") ? [["Oct 6", "Tests written first, failing as expected"]] : []),
      ...(tstates.every((s) => s === "passing") ? [["Oct 6", "All tests passing", "good"]] : []),
      ...(released ? [["Oct 6", "Released · triggers armed", "good"]] : []),
    ];
    return { id: p.name, plan: x.plan || "left-nav", kind: p.kind, state, says: p.says, live: true,
      last: x.last ?? 3, evals: x.evals || (released ? series(1, 1).map((d, i) => (i < 29 ? { held: 0, broke: 0 } : { held: 2, broke: 0 })) : null),
      tests: p.tests.map((t) => [t.id, t.what, t.level, S.tests[t.id]]), triggers: x.triggers || [], history };
  });
  return [...live, ...PDATA];
}

const STATE_ORDER = ["broken", "proving", "declared", "enforced"];
const STATE_LABEL = { broken: "Broken", proving: "Being proven", declared: "Declared", enforced: "Enforced" };
const ago = (m) => m < 60 ? `${m}m ago` : m < 60 * 24 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
const evalSum = (p) => p.evals ? p.evals.reduce((a, d) => ({ held: a.held + d.held, broke: a.broke + d.broke }), { held: 0, broke: 0 }) : null;
const passCount = (p) => p.tests.filter((t) => t[3] === "passing").length;
const pathOf = (slug) => { const l = locate(slug); return l ? l.chain[0].name : "No path"; };

function evalsCell(p) {
  const e = evalSum(p);
  if (!e) return `<span class="quiet">Watched once released</span>`;
  return `${e.held.toLocaleString()} held${e.broke ? ` · <span class="bad">${e.broke} broke</span>` : " · 0 broke"}`;
}
function pipsHTML(p) {
  if (!p.tests.length) return `<span class="count">no tests yet</span>`;
  return `<span class="pips">${p.tests.map((t) => `<span class="pip ${t[3]}"></span>`).join("")}</span><span class="count">${passCount(p)}/${p.tests.length}</span>`;
}

function evalChart(p) {
  const w = 300, h = 96, top = 16, base = 76, bw = w / 30;
  const max = Math.max(1, ...p.evals.map((d) => d.held + d.broke));
  const y = (v) => base - (v / max) * (base - top);
  const bars = p.evals.map((d, i) => {
    const x = (i * bw + 1).toFixed(1), hw = (bw - 2).toFixed(1);
    const held = d.held ? `<rect class="held" x="${x}" y="${y(d.held).toFixed(1)}" width="${hw}" height="${(base - y(d.held)).toFixed(1)}" rx="1"></rect>` : "";
    const broke = d.broke ? `<rect class="broke" x="${x}" y="${top}" width="${hw}" height="${base - top}" rx="1" opacity=".9"></rect>` : "";
    return held + broke;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Evals per day for 30 days">
    <line class="grid" x1="0" x2="${w}" y1="${base + .5}" y2="${base + .5}"></line>
    <line class="grid" x1="0" x2="${w}" y1="${top}" y2="${top}" stroke-dasharray="2 3"></line>
    ${bars}
    <text class="ax" x="0" y="${h - 4}">30 days ago</text>
    <text class="ax" x="${w}" y="${h - 4}" text-anchor="end">today</text>
    <text class="ax" x="${w}" y="${top - 4}" text-anchor="end">${max}/day</text></svg>`;
}

      <div class="stat"><span class="k">Tests</span><span class="v ${p.tests.length && passCount(p) === p.tests.length ? "ok" : ""}">${p.tests.length ? `${passCount(p)}/${p.tests.length}` : "—"}</span><span class="sub">${p.tests.length ? "passing" : "none planned yet"}</span></div>
      <div class="stat"><span class="k">Evals · 30 days</span><span class="v">${e ? e.held.toLocaleString() : "—"}</span><span class="sub">${e ? "held" : "starts at release"}</span></div>
      <div class="stat"><span class="k">Broke · 30 days</span><span class="v ${e && e.broke ? "bad" : ""}">${e ? e.broke : "—"}</span><span class="sub">${e ? (e.broke ? "times" : "never") : "starts at release"}</span></div>
      <div class="stat"><span class="k">Last eval</span><span class="v">${lastEval}</span><span class="sub">${p.triggers.length} trigger${p.triggers.length === 1 ? "" : "s"}</span></div>
    </section>
    <div class="pcols">
      <div class="viewstack">
        <section class="box"><h3>Tests that back it</h3>
          <p class="hint">Each is the smallest test that proves part of the promise.</p>
          ${p.tests.length ? `<div class="tbl"><table><thead><tr><th>ID</th><th>What it checks</th><th>Level</th><th>State</th><th>Last run</th></tr></thead><tbody>
            ${p.tests.map((t) => `<tr><td class="mono">${t[0]}</td><td>${esc(t[1])}<div class="mono" style="margin-top:2px">${fileFor(t)}</div></td><td>${t[2]}</td><td><span class="state ${t[3]}">${t[3]}</span></td><td class="mono" style="white-space:nowrap">${runFor(t)}</td></tr>`).join("")}
          </tbody></table></div>` : `<p class="hint" style="margin:0">No tests yet. They're planned at the Test plan stage.</p>`}
        </section>
        <section class="box"><h3>What triggers an eval</h3>
          <p class="hint">Telemetry from production. When a signal fires, the check runs against live data.</p>
          ${p.triggers.length ? `<ul class="trig">${p.triggers.map((t) => {
            const st = t[3] === "failing" ? `<span class="chip broken">failing</span>` : e ? `<span class="chip enforced">armed</span>` : `<span class="chip declared">armed at release</span>`;
            return `<li><div class="top1"><code>${t[0]}</code>${st}</div><span class="when">When: ${esc(t[1])}</span><span class="check"><b>Checks</b> ${esc(t[2])}</span></li>`;
          }).join("")}</ul>` : `<p class="hint" style="margin:0">No triggers yet. They're defined with the tests.</p>`}
        </section>
        <section class="box"><h3>History</h3>
          <ol class="timeline">${[...p.history].reverse().map((h) => `<li class="${h[2] || ""}"><span class="when">${h[0]}</span><span class="tdot"></span><span class="what">${esc(h[1])}</span></li>`).join("")}</ol>
        </section>
      </div>
      <div class="viewstack">
        <section class="box chart"><h3>In use</h3>
          ${e ? `${evalChart(p)}<p>${e.held.toLocaleString()} evals held in 30 days.${e.broke ? ` <span style="color:var(--bad);font-weight:600">${e.broke} broke</span>, shown in red.` : " None broke."}</p>`
              : `<p>Not watched yet. Evals start when the plan is released and its triggers are armed.</p>`}
        </section>
        ${sibs.length ? `<section class="box"><h3>Same plan</h3><div class="sibs">${sibs.map((s) => `<button class="sib" type="button" data-pid="${s.id}"><span class="d ${s.state}"></span><span>${esc(s.says)}</span></button>`).join("")}</div></section>` : ""}
        <section class="box facts"><h3>Where it lives</h3><dl>
          <dt>Promise</dt><dd>${p.id}</dd>
          <dt>Declared in</dt><dd>.indusk/planning/${p.plan}/brief.md</dd>
          <dt>Evals</dt><dd>.indusk/evals/${p.id}.yaml</dd></dl></section>
      </div>
    </div>`;

  $("backBtn").onclick = () => { VIEW = "promises"; render(); window.scrollTo(0, 0); };
  $("crumbProm").onclick = $("backBtn").onclick;
  document.querySelectorAll("#promView [data-plan]").forEach((b) => b.onclick = () => openPlan(b.dataset.plan));
  document.querySelectorAll(".sib").forEach((b) => b.onclick = () => openPromise(b.dataset.pid));
  if ($("fixBtn")) $("fixBtn").onclick = () => { $("fixNote").textContent = "In the real tool, Claude would open a plan that starts with a failing test for this case."; };
}

function openPromise(id) { VIEW = "promise"; PID = id; drawerOpen = false; applyShell(); render(); window.scrollTo(0, 0); }
function openPlan(slug) { VIEW = "plan"; SEL = slug; S.open = null; drawerOpen = false; applyShell(); render(); window.scrollTo(0, 0); }

/* Nav: collapses to a strip on wide screens, becomes a drawer on phones. */
const phoneMQ = window.matchMedia("(max-width: 760px)");
let drawerOpen = false;
let collapsed = false;
try { collapsed = localStorage.getItem("cockpit.nav") === "collapsed"; } catch (e) {}
function applyShell() {
  const phone = phoneMQ.matches;
  $("shell").classList.toggle("collapsed", collapsed);
  $("shell").classList.toggle("open", phone && drawerOpen);
  $("sidenav").inert = phone && !drawerOpen;
  const t = $("navToggle");
  t.setAttribute("aria-expanded", phone ? String(drawerOpen) : String(!collapsed));
  t.setAttribute("aria-label", phone ? "Close plans" : collapsed ? "Expand plans" : "Collapse plans");
  t.title = t.getAttribute("aria-label");
  $("menuBtn").setAttribute("aria-expanded", String(phone && drawerOpen));
}
$("navToggle").onclick = () => {
  if (phoneMQ.matches) { drawerOpen = false; applyShell(); $("menuBtn").focus(); return; }
  collapsed = !collapsed;
  try { localStorage.setItem("cockpit.nav", collapsed ? "collapsed" : "open"); } catch (e) {}
  applyShell();
};
$("menuBtn").onclick = () => { drawerOpen = true; applyShell(); $("navToggle").focus(); };
$("scrim").onclick = () => { drawerOpen = false; applyShell(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && drawerOpen) { drawerOpen = false; applyShell(); $("menuBtn").focus(); } });
phoneMQ.addEventListener("change", () => { drawerOpen = false; applyShell(); });
applyShell();

function card(html, kind) {
  const dot = kind === "ask" ? "ask" : kind === "busy" ? "busy" : "";
  const who = kind === "ask" ? "Claude needs you" : kind === "busy" ? "Claude is working" : "Claude";
  return `<div class="card ${kind === "ask" ? "ask" : ""}"><div class="who"><span class="dot ${dot}"></span>${who}</div>${html}</div>`;
}

function renderCard() {
  const v = S.view, st = S.status[v], host = $("cardHost");
  if (st === "done") {
    const done = {
      0: ["Brief accepted", "Two promises: every plan is one click away, and the nav fits a phone. It keeps one promise from earlier work."],
      1: ["Test plan accepted", "Six assertions, each the smallest test that proves it: four unit tests and two contract tests."],
      2: ["Decision recorded", "A sidebar that folds into a drawer on phones."],
      3: ["Plan approved", "Three build phases, six tests written first. Planning is closed."],
      4: ["Built", "Three phases closed. Six tests passing."],
      5: ["Falsification found one break", "A plan renamed on disk kept its old link. Fixed, with a test."],
      6: ["Cleanup found nothing", "Every changed file was reviewed. Nothing repeats across files."],
      7: ["Accepted", "You accepted the build."],
      8: ["Released", "Merged to concierge-web main. The promises are now watched in use."],
    }[v];
    host.innerHTML = card(`<h2>${done[0]}</h2><button class="more" type="button" id="why">${S.why ? "Less" : "More"}</button>${S.why ? `<p>${done[1]}</p>` : ""}`, "done");
    $("why").onclick = () => { S.why = !S.why; render(); };
    return;
  }
  if (st === "working") {
    const phases = S.step === "build"
      ? [["Phase 1 · the nav lists every plan", S.buildAt > 0], ["Phase 2 · the phone drawer", S.buildAt > 1], ["Phase 3 · live updates", S.buildAt > 2]]
      : S.step === "falsify" ? [["Trying five ways to break the nav", S.tick > 0], ["Fixing what broke", S.tick > 1]]
      : [["Reviewing the changed files", S.tick > 0]];
    const doneN = phases.filter((x) => x[1]).length;
    host.innerHTML = card(`<h2>${{ build: "Building", falsify: "Looking for ways it breaks", cleanup: "Tidying" }[S.step]} · ${doneN} of ${phases.length}</h2>
      <button class="more" type="button" id="why">${S.why ? "Hide steps" : "Steps"}</button>
      <ul class="progress" ${S.why ? "" : "hidden"}>${phases.map(([t, ok], i) => `<li><span class="tick ${ok ? "ok" : i === phases.findIndex((p) => !p[1]) ? "run" : "wait"}">${ok ? "✓" : i === phases.findIndex((p) => !p[1]) ? "●" : "○"}</span>${t}</li>`).join("")}</ul>`, "busy");
    $("why").onclick = () => { S.why = !S.why; render(); };
    return;
  }
  if (st === "waiting") { host.innerHTML = card(`<h2>Not started</h2><p>This step starts when the one before it is done.</p>`, "done"); return; }

  const c = CARDS[S.step];
  host.innerHTML = card(`
    <h2>${esc(c.title)}</h2>
    ${S.said ? `<p class="you-said">You said: ${esc(S.said)}</p><p>${esc(c.maybeReply)}</p>` : ""}
    ${!S.said ? `<button class="more" type="button" id="why">${S.why ? "Hide why" : "Why?"}</button>${S.why ? `<p>${esc(c.body)}</p>` : ""}` : ""}
    <div class="answers">
      <button class="btn yes" type="button" id="yes">${esc(c.yes)}</button>
      <button class="btn" type="button" id="no">${esc(c.no)}</button>
      <button class="btn maybe" type="button" id="maybe">Maybe…</button>
    </div>
    ${S.maybe ? `<div class="reply"><label class="label" for="msg" style="margin:0">Tell Claude what you're thinking</label>
      <textarea id="msg" placeholder="e.g. Fine, but group the plans once there are lots of them"></textarea>
      <div class="row"><button class="btn" type="button" id="cancel">Cancel</button><button class="btn yes" type="button" id="send">Send</button></div></div>` : ""}
  `, "ask");
  if ($("why")) $("why").onclick = () => { S.why = !S.why; render(); };
  $("yes").onclick = () => answer("yes");
  $("no").onclick = () => answer("no");
  $("maybe").onclick = () => { S.maybe = true; render(); $("msg").focus(); };
  if (S.maybe) {
    $("cancel").onclick = () => { S.maybe = false; render(); };
    $("send").onclick = () => { const t = $("msg").value.trim() || "Not sure — what would you suggest?"; S.said = t; S.maybe = false; S.log.push(`You: ${t}`); S.log.push("Claude revised its proposal"); render(); };
  }
}

function setStage(i, st) { S.status[i] = st; }
function goto(i, step) { S.stage = i; S.view = i; S.step = step; S.said = null; S.maybe = false; S.why = false; }

function answer(a) {
  const c = CARDS[S.step];
  if (a === "no") {
    // No opens the reply box with the choice filled in, so the person can say why.
    S.maybe = true; render();
    $("msg").value = `${c.no}, because `; $("msg").focus();
    return;
  }
  S.log.push(`You: ${c.yes}`);
  if (S.step === "adr") { setStage(2, "done"); setStage(3, "needs"); goto(3, "impl"); S.log.push("Impl written · 3 phases, 6 tests"); }
  else if (S.step === "impl") {
    setStage(3, "done"); setStage(4, "working"); goto(4, "build"); S.buildAt = 0;
    ["A1", "A2", "A3", "A4", "A5"].forEach((t) => S.tests[t] = "written");
    S.log.push("Planning closed · release workflow started");
    S.log.push("Tests written first · 5 failing as expected");
    runBuild(); }
  else if (S.step === "midbuild") { setStage(4, "working"); S.step = "build"; S.said = null; S.why = false; runBuild(); }
  else if (S.step === "review") { setStage(7, "done"); setStage(8, "done"); S.stage = 8; S.view = 8; S.log.push("Released · merged to concierge-web main"); }
  render();
}

function later(ms, fn) { setTimeout(() => { fn(); render(); }, ms); }

function runBuild() {
  if (S.buildAt === 0) later(1400, () => { S.buildAt = 1; S.tests.A1 = "passing"; S.tests.A2 = "passing"; S.log.push("Phase 1 closed · A1, A2 passing");
    later(1200, () => { setStage(4, "needs"); S.step = "midbuild"; S.view = 4; S.log.push("Phase 2 stopped for your choice"); }); });
  else if (S.buildAt === 1) later(1300, () => { S.buildAt = 2; S.tests.A4 = "passing"; S.tests.A5 = "passing"; S.log.push("Phase 2 closed · A4, A5 passing");
    later(1300, () => { S.buildAt = 3; S.tests.A3 = "passing"; S.log.push("Phase 3 closed · A3 passing");
      setStage(4, "done"); setStage(5, "working"); goto(5, "falsify"); S.tick = 0;
      later(1300, () => { S.tick = 1; S.log.push("Falsification found 1 break · renamed plan kept its old link");
        later(1100, () => { S.tick = 2; S.log.push("Fixed, with a new test");
          setStage(5, "done"); setStage(6, "working"); goto(6, "cleanup"); S.tick = 0;
          later(1300, () => { setStage(6, "done"); setStage(7, "needs"); goto(7, "review"); S.log.push("Review ready · both promises proven"); });
        }); }); }); });
}

$("promLink").onclick = () => { VIEW = "promises"; drawerOpen = false; applyShell(); render(); window.scrollTo(0, 0); };
$("reset").onclick = () => { S = initial(); render(); };
render();
</script>

</body>
</html>
