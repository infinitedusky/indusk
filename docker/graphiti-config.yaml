server:
  transport: "http"
  host: "0.0.0.0"
  port: 8100

llm:
  provider: "gemini"
  # `-latest` aliases track Google's current GA flash models — well-provisioned
  # (unlike `-preview` models, which have lower capacity and 503 more) and never
  # deprecated, so we don't chase version retirements. Pin to e.g. gemini-3.5-flash
  # if deterministic extraction behavior is preferred over auto-tracking.
  model: "gemini-flash-latest"
  small_model: "gemini-flash-lite-latest"
  max_tokens: 4096

  providers:
    gemini:
      api_key: ${GOOGLE_API_KEY}

embedder:
  provider: "gemini"
  model: "gemini-embedding-001"
  dimensions: 768

  providers:
    gemini:
      api_key: ${GOOGLE_API_KEY}

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: redis://localhost:6379
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:shared}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  user_id: ${USER_ID:indusk}
